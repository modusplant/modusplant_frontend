services:
  frontend:
    container_name: modusplant_frontend
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install -g pnpm@9 && pnpm install --frozen-lockfile && pnpm dev"
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    environment:
      BASE_URL: http://host.docker.internal:80
      NEXT_PUBLIC_IMAGE_HOSTNAME: host.docker.internal
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: always
    networks:
      - nginx_proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  node_modules:
  next_cache:

networks:
  nginx_proxy:
    external: true
