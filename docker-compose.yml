services:
  frontend:
    container_name: modusplant_frontend
    image: node:24-alpine
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        # Reuse the build cache only within the same container.
        if ! cmp -s /etc/hostname /app/.next/.container-id; then
          find /app/.next -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp /etc/hostname /app/.next/.container-id
        fi
        npm install -g pnpm@9
        pnpm install --frozen-lockfile
        exec pnpm dev
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    environment:
      BASE_URL: http://host.docker.internal:80
      NEXT_PUBLIC_IMAGE_HOSTNAME: host.docker.internal
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - type: volume
        target: /app/.next
        volume:
          nocopy: true
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: always
    networks:
      - nginx_proxy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  node_modules:

networks:
  nginx_proxy:
    external: true
